<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#111622"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b7cff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="12%" r="60%">
      <stop offset="0" stop-color="#5b7cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5b7cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#202839" stroke-width="1" opacity="0.5">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- logo tile -->
  <rect x="90" y="150" width="120" height="120" rx="30" fill="url(#brand)"/>
  <g transform="translate(115 175) scale(2.2)" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M23 8.5C18 5 10 6.5 10 11.5S22 17 22 22 12 27 8 23"/>
    <circle cx="23" cy="8.5" r="2.6" fill="#fff" stroke="none"/>
    <circle cx="16" cy="16" r="3" fill="#fff" stroke="none"/>
    <circle cx="8" cy="23" r="2.6" fill="#fff" stroke="none"/>
  </g>

  <!-- title -->
  <text x="90" y="360" fill="#e6e9ef" font-size="82" font-weight="800" letter-spacing="-2">SysDesign Visual</text>
  <text x="92" y="418" fill="#9aa4b8" font-size="34" font-weight="500">図で学ぶシステム設計 · Learn system design by diagrams</text>

  <text x="1110" y="580" text-anchor="end" fill="#6b7488" font-size="24">Built by Kanta Nakamura</text>
</svg>
