<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#111622"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b7cff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="12%" r="60%">
      <stop offset="0" stop-color="#5b7cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5b7cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#202839" stroke-width="1" opacity="0.5">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- logo tile: the Reliable Owl mark (V brow, big eyes, beak) -->
  <rect x="90" y="150" width="120" height="120" rx="30" fill="url(#brand)"/>
  <g transform="translate(90 150) scale(3.75)">
    <path d="M4.5 8.5L16 13.2L27.5 8.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="10.6" cy="18" r="5.6" fill="#fff"/>
    <circle cx="21.4" cy="18" r="5.6" fill="#fff"/>
    <circle cx="11.4" cy="18.2" r="2.5" fill="#3b4bc4"/>
    <circle cx="22.2" cy="18.2" r="2.5" fill="#3b4bc4"/>
    <path d="M14.6 24.2H17.4L16 26.4Z" fill="#fff"/>
  </g>

  <!-- title -->
  <text x="90" y="360" fill="#e6e9ef" font-size="82" font-weight="800" letter-spacing="-2">Reliable Owl</text>
  <text x="92" y="418" fill="#9aa4b8" font-size="34" font-weight="500">図で学ぶ システム設計 &amp; SRE · Learn system design &amp; SRE</text>
</svg>
